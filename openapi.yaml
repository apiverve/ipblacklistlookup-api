openapi: 3.0.4
info:
  title: IP Blacklist Lookup
  description: >-
    IP Blacklist Lookup is an IP blacklist check API that tells you whether a
    given IP address appears on known malicious IP blocklists. Identifies both
    inbound threats (attackers, spammers) and outbound threats (C2 servers,
    malware hosts).
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/ipblacklistlookup:
    get:
      summary: IP Blacklist Lookup
      description: >-
        Checks whether an IP address appears on inbound (attacker) or outbound
        (malicious destination) blocklists and returns threat level assessment
        with geolocation details.
      operationId: ipblacklistlookup
      parameters:
        - name: ip
          in: query
          schema:
            type: string
          required: true
          description: The IP address to check against blocklists
          example: 185.220.101.1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  ipAddress: 185.220.101.1
                  isIPBlacklisted: true
                  isPublic: true
                  inbound:
                    found: true
                    description: >-
                      IP is known for malicious inbound activity (spam,
                      scanning, brute-force attacks)
                  outbound:
                    found: true
                    description: >-
                      IP is a known malicious destination (C2 server, malware
                      host, phishing)
                  threatLevel: critical
                  isTor: true
                  ipDetails:
                    ip: 185.220.101.1
                    country: DE
                    region: BB
                    timezone: Europe/Berlin
                    city: Brandenburg an der Havel
                    coordinates:
                      - 52.6171
                      - 13.1207
                    countryName: Germany
                    regionName: Brandenburg
                    postalCode: '14621'
                    continent: EU
                    continentName: Europe
                    accuracyRadius: 20
                    isEU: true
                  asn: AS60729
                  asnName: TORSERVERS-NET
                  hostingProvider: null
                  listedInSubnet: 255
                  isRiskySubnet: true
                  isVpn: true
                  isDatacenter: true
                  isRelay: false
                  blocklists:
                    - name: DroneBL
                      zone: dnsbl.dronebl.org
                      listed: false
                    - name: UCEPROTECT Level 1
                      zone: dnsbl-1.uceprotect.net
                      listed: false
                    - name: 0spam
                      zone: bl.0spam.org
                      listed: false
                    - name: PSBL
                      zone: psbl.surriel.com
                      listed: false
                  blocklistsListed: 0
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
