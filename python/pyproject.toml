[project]
name = "apiverve-ipblacklistlookup"
version = "1.2.2"
authors = [
  { name="APIVerve", email="hello@apiverve.com" },
]
description = "IP Blacklist Lookup is an IP blacklist check API that tells you whether a given IP address appears on known malicious IP blocklists. Identifies both inbound threats (attackers, spammers) and outbound threats (C2 servers, malware hosts)."
keywords = ["ip blacklist check api", "blacklist check api", "ip reputation check api", "ip reputation api", "ip blacklist api"]
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "requests>=2.25.0"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Natural Language :: English",
]

[project.urls]
Homepage = "https://apiverve.com/marketplace/ipblacklistlookup?utm_source=pypi&utm_medium=referral&utm_content=homepage"
Documentation = "https://docs.apiverve.com/ref/ipblacklistlookup?utm_source=pypi&utm_medium=referral&utm_content=docs"
Repository = "https://github.com/apiverve/ipblacklistlookup-api"
Twitter = "https://twitter.com/apivervehq"
